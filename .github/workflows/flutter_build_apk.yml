# ============================================================
#  LACAK QRIS BUILD MODE v1.37 — WOLKER FLUTTER (GitHub Actions)
# ============================================================
# Letakkan file ini di repo wolker dengan nama:
#   .github/workflows/flutter_build_apk.yml
# Nama file HARUS sama dengan cfg.buildWorkers[].workflow di config.js bot.
#
# Cara kerja:
#   Bot upload ZIP project ke uploads/<job_id>.zip di repo ini (via GitHub API),
#   lalu menjalankan workflow ini (workflow_dispatch) dengan input:
#     job_id   : ID antrian dari bot (FBxxxxxxx)
#     zip_path : uploads/<job_id>.zip
#     mode     : "release" atau "debug"
#   Hasil:
#     1. APK di-COMMIT ke repo: builds/<job_id>/app.apk
#        → link download dari wolker: raw.githubusercontent.com (BEBAS UKURAN)
#     2. Artifact "apk-<job_id>" (cadangan, retention 7 hari)
#     3. Ganti icon APK otomatis kalau ZIP berisi assets/icon.png (atau icon.png)
#     4. Kalau build GAGAL → artifact "log-<job_id>" berisi build_log.txt
#        → bot ekstrak & kirim FILE KESIMPULAN ERROR ke user
#
# GITHUB_TOKEN bawaan cukup — permissions: contents WRITE (commit APK) + actions write.
# Tidak perlu secret tambahan.
# ============================================================

name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID antrian dari bot"
        required: true
        default: "FB000000"
      zip_path:
        description: "Path ZIP project di repo (uploads/xxx.zip)"
        required: true
        default: ""
      mode:
        description: "Mode build (release/debug)"
        required: false
        default: "release"
      app_name:
        description: "Nama APK (opsional — bot biasanya inject APP_NAME.txt di ZIP)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo wolker
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Download ZIP project (${{ github.event.inputs.job_id }})
        run: |
          JOB="${{ github.event.inputs.job_id }}"
          ZIP="${{ github.event.inputs.zip_path }}"
          if [ -z "$ZIP" ]; then
            # fallback: cari uploads/<job>.zip
            ZIP="uploads/${JOB}.zip"
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP tidak ditemukan: $ZIP" | tee -a build_log.txt
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP" -d project || { echo "::error::ZIP rusak/tidak bisa dibuka" | tee -a build_log.txt; exit 1; }
          # kalau ZIP punya 1 folder akar, naikkan isinya
          if [ ! -f project/pubspec.yaml ]; then
            SUB=$(find project -maxdepth 2 -name pubspec.yaml | head -1)
            if [ -z "$SUB" ]; then
              echo "::error::pubspec.yaml tidak ada di ZIP!" | tee -a build_log.txt
              exit 1
            fi
            rsync -a --remove-source-files "$(dirname "$SUB")/" project/ 2>/dev/null || true
            rm -rf project/*/ 2>/dev/null || true
          fi
          echo "PROJECT ready: $(ls project | head)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform android (kalau project tanpa folder android)
        working-directory: project
        run: flutter create --platforms android . >/dev/null 2>&1 || true

      - name: Ganti icon APK (kalau ada assets/icon.png di ZIP)
        working-directory: project
        run: |
          ICON=""
          for c in assets/icon.png icon.png assets/icon.jpg assets/icon.jpeg icon.jpg; do
            [ -f "$c" ] && ICON="$c" && break
          done
          if [ -n "$ICON" ]; then
            echo "ICON ditemukan: $ICON — mengganti launcher icon..."
            R=android/app/src/main/res
            convert "$ICON" -auto-orient -background none -resize 48x48  "$R/mipmap-mdpi/ic_launcher.png"    || true
            convert "$ICON" -auto-orient -background none -resize 72x72  "$R/mipmap-hdpi/ic_launcher.png"    || true
            convert "$ICON" -auto-orient -background none -resize 96x96  "$R/mipmap-xhdpi/ic_launcher.png"   || true
            convert "$ICON" -auto-orient -background none -resize 144x144 "$R/mipmap-xxhdpi/ic_launcher.png" || true
            convert "$ICON" -auto-orient -background none -resize 192x192 "$R/mipmap-xxxhdpi/ic_launcher.png"|| true
            convert "$ICON" -auto-orient -background none -resize 512x512 ic_launcher_playstore.png || true
          else
            echo "ICON tidak ada — pakai icon default Flutter."
          fi

      - name: Ganti nama APK (APP_NAME.txt dari bot / input app_name)
        working-directory: project
        run: |
          NAME="${{ github.event.inputs.app_name }}"
          if [ -f APP_NAME.txt ] && [ -s APP_NAME.txt ]; then
            NAME=$(head -c 60 APP_NAME.txt | tr -d '\n\r' | sed "s/[\"']//g")
          fi
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -n "$NAME" ] && [ -f "$MANIFEST" ]; then
            echo "Nama APK: $NAME — mengganti android:label..."
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$NAME\"/" "$MANIFEST" || true
            grep -o 'android:label="[^"]*"' "$MANIFEST" | head -1
          else
            echo "APP_NAME.txt / app_name tidak ada — pakai nama default."
          fi

      - name: flutter pub get
        working-directory: project
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a build_log.txt

      - name: Build APK (${{ github.event.inputs.mode }})
        working-directory: project
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" != "debug" ]; then MODE="release"; fi
          flutter build apk --"$MODE" --no-shrink 2>&1 | tee -a build_log.txt

      - name: Siapkan APK
        if: success()
        run: |
          JOB="${{ github.event.inputs.job_id }}"
          APK=$(find project -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan!" | tee -a build_log.txt
            exit 1
          fi
          mkdir -p out "builds/${JOB}"
          cp "$APK" "out/app-${JOB}.apk"
          cp "$APK" "builds/${JOB}/app.apk"       # ← untuk link download dari wolker (bebas ukuran)
          ls -lh out "builds/${JOB}"

      - name: Commit APK ke repo (link download dari wolker)
        if: success()
        run: |
          JOB="${{ github.event.inputs.job_id }}"
          git config user.name  "lacak-qris-buildbot"
          git config user.email "buildbot@users.noreply.github.com"
          git add "builds/${JOB}/app.apk"
          git commit -m "build ${JOB} [bot] · hasil APK untuk link download" || echo "tidak ada perubahan"
          git push origin HEAD:"${{ github.ref_name }}" || git push origin HEAD

      - name: Upload artifact APK (apk-<job_id>) — cadangan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.job_id }}
          path: out/*.apk
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload log build (log-<job_id>) — untuk kesimpulan error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.event.inputs.job_id }}
          path: |
            project/build_log.txt
            build_log.txt
          retention-days: 7
          if-no-files-found: ignore
